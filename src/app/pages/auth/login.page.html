<ion-content [fullscreen]="true">
  <div class="floating-back-btn">
    <ion-back-button defaultHref="/tabs/perfil" text=""></ion-back-button>
  </div>
  <div class="auth-wrapper">
    <div class="auth-card">
      <section class="auth-hero">
        <div class="logo-wrapper">
          <img src="assets/img/Logo.png" alt="Refugio Animal" />
        </div>
        <h1>Bienvenido de vuelta</h1>
        <p>Accede para solicitar adopciones y gestionar tu perfil.</p>
      </section>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" class="auth-form">
        <ion-list lines="none" class="auth-fields-list">
          <ion-item class="auth-input-item">
            <ion-label position="stacked">Email</ion-label>
            <ion-input
              formControlName="email"
              type="email"
              autocomplete="email"
              placeholder="ejemplo@adopta.es"
              (ionInput)="errorMessage = ''"
            ></ion-input>
          </ion-item>
          <ion-item class="auth-input-item">
            <ion-label position="stacked">Contraseña</ion-label>
            <ion-input
              formControlName="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              (ionInput)="errorMessage = ''"
            ></ion-input>
          </ion-item>
        </ion-list>

        <div class="error-container" *ngIf="loginForm.touched && loginForm.invalid">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <ion-text class="field-error">
            Introduce un email válido y una contraseña de al menos 6 caracteres.
          </ion-text>
        </div>

        <div class="error-container" *ngIf="errorMessage">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <ion-text class="field-error">{{ errorMessage }}</ion-text>
        </div>

        <ion-button type="submit" class="btn-primary" expand="block" size="large" [disabled]="isSubmitting">
          <ion-icon name="log-in-outline" slot="start"></ion-icon>
          {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
        </ion-button>

        <div class="auth-footer">
          <p>¿No tienes cuenta aún?</p>
          <ion-button fill="clear" class="btn-link" routerLink="/registro">
            <ion-icon name="create-outline" slot="start"></ion-icon>
            Crear una cuenta
          </ion-button>
        </div>
      </form>
    </div>
  </div>
</ion-content>
