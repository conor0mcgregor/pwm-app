<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <section class="auth-hero compact">
    <img src="assets/img/Logo.png" alt="Refugio Animal" />
    <h1>Crea tu cuenta</h1>
    <p>Guardaremos tus datos para agilizar las solicitudes de adopcion.</p>
  </section>

  <form [formGroup]="registerForm" (ngSubmit)="submit()" class="auth-form">
    <ion-list lines="full">
      <ion-item>
        <ion-label position="stacked">Nombre</ion-label>
        <ion-input formControlName="nombre" autocomplete="given-name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Apellidos</ion-label>
        <ion-input formControlName="apellidos" autocomplete="family-name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">DNI</ion-label>
        <ion-input formControlName="dni"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Direccion</ion-label>
        <ion-input formControlName="direccion" autocomplete="street-address"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Telefono</ion-label>
        <ion-input formControlName="telefono" type="tel" autocomplete="tel"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input formControlName="email" type="email" autocomplete="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Contrasena</ion-label>
        <ion-input formControlName="password" type="password" autocomplete="new-password"></ion-input>
      </ion-item>
    </ion-list>

    <ion-text color="danger" class="field-error" *ngIf="registerForm.touched && registerForm.invalid">
      Completa todos los campos. La contrasena debe tener al menos 6 caracteres.
    </ion-text>

    <ion-button type="submit" expand="block" size="large" [disabled]="isSubmitting">
      <ion-icon name="create-outline" slot="start"></ion-icon>
      Registrarme
    </ion-button>

    <ion-button fill="clear" expand="block" routerLink="/login">Ya tengo cuenta</ion-button>
  </form>
</ion-content>
